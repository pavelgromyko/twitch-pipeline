cache_timeout: null
catalog: null
schema: twitch
sql: "WITH snaps AS (\r\n    SELECT\r\n        snapshot_ts,\r\n        dateDiff('second',\r\
  \n            lagInFrame(snapshot_ts, 1, snapshot_ts) OVER (\r\n               \
  \ ORDER BY snapshot_ts\r\n                ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED\
  \ FOLLOWING\r\n            ),\r\n            snapshot_ts) AS gap_sec\r\n    FROM\
  \ (SELECT DISTINCT snapshot_ts FROM twitch.last_day)\r\n)\r\nSELECT\r\n    s.game_id\
  \ AS game_id,\r\n    argMax(s.game_name, s.snapshot_ts) AS game,\r\n    round(sum(s.viewer_count\
  \ * g.gap_sec / 3600)) AS viewer_hours\r\nFROM twitch.last_day AS s\r\nINNER JOIN\
  \ snaps AS g ON s.snapshot_ts = g.snapshot_ts\r\nWHERE g.gap_sec BETWEEN 1 AND 1800\r\
  \n  AND s.game_id != 0\r\nGROUP BY s.game_id\r\nORDER BY viewer_hours DESC"
