schema: twitch
sql: "WITH\r\n    genre_freq AS (\r\n        SELECT genre, count() AS games\r\n  \
  \      FROM twitch.dim_games\r\n        ARRAY JOIN genres AS genre\r\n        GROUP\
  \ BY genre\r\n    ),\r\n    main_genre AS (\r\n        SELECT g.game_id AS game_id,\
  \ argMax(g.genre, f.games) AS genre\r\n        FROM (SELECT game_id, genre FROM\
  \ twitch.dim_games ARRAY JOIN genres AS genre) AS g\r\n        INNER JOIN genre_freq\
  \ AS f ON g.genre = f.genre\r\n        GROUP BY g.game_id\r\n    )\r\nSELECT\r\n\
  \    if(m.genre = '', 'Unknown', m.genre) AS genre_name,\r\n    sum(s.viewer_count)\
  \ AS viewers,\r\n    round(100 * sum(s.viewer_count) / (SELECT sum(viewer_count)\
  \ FROM twitch.latest_snapshot), 1) AS share_pct\r\nFROM twitch.latest_snapshot AS\
  \ s\r\nLEFT JOIN main_genre AS m ON s.game_id = m.game_id\r\nGROUP BY genre_name\r\
  \nORDER BY viewers DESC"
