sql: "SELECT\r\n    language,\r\n    sum(viewer_count) AS viewers,\r\n    round(100\
  \ * sum(viewer_count) / (SELECT sum(viewer_count) FROM twitch.latest_snapshot),\
  \ 1) AS share_pct\r\nFROM twitch.latest_snapshot\r\nGROUP BY language\r\nORDER BY\
  \ viewers DESC\r\nLIMIT 10"
