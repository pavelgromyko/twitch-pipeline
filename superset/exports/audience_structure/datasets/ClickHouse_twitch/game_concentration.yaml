schema: twitch
sql: "SELECT\r\n    game_name,\r\n    sum(viewer_count) AS viewers,\r\n    count()\
  \ AS streams,\r\n    round(100 * arraySum(arraySlice(arrayReverseSort(groupArray(viewer_count)),\
  \ 1, 3))\r\n          / sum(viewer_count), 1) AS top3_share_pct\r\nFROM twitch.latest_snapshot\r\
  \nWHERE game_id != 0\r\nGROUP BY game_name\r\nHAVING streams >= 5\r\nORDER BY viewers\
  \ DESC\r\nLIMIT 10"
